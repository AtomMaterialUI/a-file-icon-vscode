# SonarQube Cloud Automatic Analysis reads this file (not sonar-project.properties, which is for CI scanners).
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

# Only our own code and tests. This leaves out the iconGenerator submodule (AtomMaterialUI/iconGenerator),
# the generated color themes (themes/*.base.json) and the build output.
sonar.sources=src,media
sonar.tests=test

# Generated by src/scripts/icons/syncUpstream.ts from iconGenerator: not edited by hand.
sonar.exclusions=src/icons/files/upstream.ts,src/icons/folders/upstream.ts

# Declarative tables (name -> icon, theme -> colors): the same keys repeat on purpose in every entry,
# which the copy-paste detector counts as duplicated blocks. Issues are still reported for these files.
sonar.cpd.exclusions=src/icons/files/**,src/icons/folders/**,src/icons/languageIcons.ts,src/helpers/themes.ts

sonar.sourceEncoding=UTF-8

# SonarQube Cloud settings, read by the CI analysis of .github/workflows/sonar.yml (which copies it to
# sonar-project.properties; Automatic Analysis, now off, read this file directly). Maintenance rules: docs/MAINTENANCE.md.

# Only our own code and tests. This leaves out the iconGenerator submodule (AtomMaterialUI/iconGenerator),
# the generated color themes (themes/*.base.json) and the build output.
# media/ is the script of the theme mixer webview: it receives the messages of the page, its security matters as much.
sonar.sources=src,media
sonar.tests=test

# Generated by src/scripts/icons/syncUpstream.ts from iconGenerator: not edited by hand.
# iconGenerator/** too: the CI checks the submodule out and the TypeScript analysis still reported issues in it.
sonar.exclusions=src/icons/files/upstream.ts,src/icons/folders/upstream.ts,iconGenerator/**

# Declarative tables (name -> icon, theme -> colors): the same keys repeat on purpose in every entry,
# which the copy-paste detector counts as duplicated blocks. Issues are still reported for these files.
sonar.cpd.exclusions=src/icons/files/**,src/icons/folders/**,src/icons/languageIcons.ts,src/helpers/themes.ts

# Coverage (CI analysis only: Automatic Analysis cannot import it) counts what the unit tests can run.
# Left out: the build-time scripts (they run on the developer's machine and in CI, not in VS Code), the webview script
# (a browser page: checked by the smoke tests), the web entry point (an empty stub), the types and the data tables (loaded, so always "covered").
sonar.coverage.exclusions=src/scripts/**,media/**,src/web/**,src/@types/**,src/icons/files/**,src/icons/folders/**

sonar.sourceEncoding=UTF-8

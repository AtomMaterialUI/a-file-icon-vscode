name: Build + Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    name: ${{ matrix.os }}

    env:
      # puppeteer is only used by the screenshot scripts
      PUPPETEER_SKIP_DOWNLOAD: '1'

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4
        with:
          submodules: true

      # same versions as environment.yml
      - name: Setup Node.js ⚙
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup bun ⚙
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install node_modules 📦
        run: bun install

      - name: Lint 🔍
        run: bun run lint

      - name: Build ⚒
        run: bun run build

      - name: Unit tests 🧪
        run: bun run test:unit

      - name: Package VSIX 📦
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes @vscode/vsce@3.6.0 package --no-dependencies --allow-missing-repository --skip-license -o a-file-icon-vscode.vsix

      - name: Upload VSIX ⬆
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: a-file-icon-vscode.vsix

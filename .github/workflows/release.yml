name: Release + Publish

# Builds the VSIX with the next version, publishes it and creates a GitHub release.
#
# `main` is protected (changes need a pull request), so this workflow never commits to it. The version is not stored
# in package.json: the next one is computed from the latest GitHub release of this repository (or from package.json
# for the first release) and written only into the VSIX. package.json keeps the version of the first release.
# An exact `version` can be given instead (e.g. to skip from 1.1.0 to 1.2.1): it must be greater than the latest release.
#
# Publishing to the registries only runs when their token secret is set:
#   OPEN_VSX_TOKEN        -> Open VSX
#   VS_MARKETPLACE_TOKEN  -> Visual Studio Marketplace (Azure DevOps token with the Marketplace "Manage" scope;
#                            it expires, create a new one and replace the secret when publishing fails with 401/403)

on:
  workflow_dispatch:
    inputs:
      versionChange:
        type: choice
        description: Select the version change
        required: true
        options:
          - patch
          - minor
          - major
      version:
        type: string
        description: Or an exact version (e.g. 1.2.1), greater than the latest release; the version change is then ignored
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CHANGE: ${{ github.event.inputs.versionChange }}
      VERSION_INPUT: ${{ github.event.inputs.version }}
      GH_TOKEN: ${{ github.token }}
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          # nothing is pushed with git: the release is made with the API
          persist-credentials: false

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup bun ⚙️
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Compute the next version 🔢
        run: |
          # The tags of the original project (v5.x) are not releases of this repository: only releases count
          BASE=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          BASE=${BASE#v}
          if [ -z "$BASE" ]; then BASE=$(node -p "require('./package.json').version"); fi
          VERSION_INPUT=$(echo "$VERSION_INPUT" | tr -d '[:space:]')
          VERSION_INPUT=${VERSION_INPUT#v}
          if [ -n "$VERSION_INPUT" ]; then
            # an exact version: x.y.z (no pre-release, the Marketplace refuses them), greater than the latest release
            if ! [[ "$VERSION_INPUT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::The version must be x.y.z, got '$VERSION_INPUT'"; exit 1
            fi
            if [ "$VERSION_INPUT" = "$BASE" ] || [ "$(printf '%s\n%s\n' "$BASE" "$VERSION_INPUT" | sort -V | tail -n 1)" != "$VERSION_INPUT" ]; then
              echo "::error::The version $VERSION_INPUT is not greater than the latest release $BASE"; exit 1
            fi
            VERSION=$VERSION_INPUT
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$VERSION_CHANGE" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              *) echo "Unknown version change: $VERSION_CHANGE"; exit 1 ;;
            esac
          fi
          echo "Previous version $BASE, next version $VERSION"
          echo VERSION=$VERSION >> $GITHUB_ENV
          echo NAME=$(node -p "require('./package.json').name") >> $GITHUB_ENV
          echo DISPLAY_NAME=$(node -p "require('./package.json').displayName") >> $GITHUB_ENV

      - name: Install node_modules 📦
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build ⚒️
        run: |
          bun run build
          bun run test:unit
          npx --yes --ignore-scripts @vscode/vsce@3.6.0 package ${{ env.VERSION }} --no-update-package-json --no-git-tag-version --no-dependencies -o ${{ env.NAME }}-${{ env.VERSION }}.vsix

      # Publish first: when it fails, no tag or release is left behind
      - name: Publish to Visual Studio Marketplace 🌐
        if: env.VS_MARKETPLACE_TOKEN != ''
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
        with:
          pat: ${{ env.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ env.NAME }}-${{ env.VERSION }}.vsix

      - name: Publish to Open VSX Registry 🌐
        if: env.OPEN_VSX_TOKEN != ''
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
        with:
          pat: ${{ env.OPEN_VSX_TOKEN }}
          extensionFile: ${{ env.NAME }}-${{ env.VERSION }}.vsix

      - name: Release ${{ env.VERSION }} 🔆
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ env.NAME }}-${{ env.VERSION }}.vsix
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.DISPLAY_NAME }} v${{ env.VERSION }}
          generate_release_notes: true

name: Sync upstream icons and colors

# Moves the iconGenerator submodule (icons and associations of the JetBrains plugin) to its latest commit,
# regenerates the converted associations, regenerates the color themes from the latest JetBrains Islands themes
# (the pinned commit only moves when a theme changes) and opens a pull request when something changed.
# Requires "Allow GitHub Actions to create and approve pull requests" in the repository settings.

on:
  schedule:
    # every Monday
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - name: Setup Node.js ⚙
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup bun ⚙
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Update iconGenerator ⬆
        id: submodule
        run: |
          git submodule update --remote iconGenerator
          echo "commit=$(git -C iconGenerator log -1 --format='%h %cs %s')" >> "$GITHUB_OUTPUT"

      - name: Install node_modules 📦
        run: bun install --frozen-lockfile

      - name: Sync associations 🔄
        run: bun run sync:upstream

      - name: Sync color themes 🎨
        run: bun run sync:colors -- --latest

      - name: Build product icons 🖼
        run: bun run build:product-icons

      # the pull request is only opened if everything still builds
      - name: Build + test ⚒
        run: |
          bun run lint
          bun run build
          bun run test:unit

      - name: Open pull request 🔀
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: chore/sync-upstream
          delete-branch: true
          add-paths: |
            iconGenerator
            src/icons/files/upstream.ts
            src/icons/folders/upstream.ts
            themes
            productIcons
          commit-message: 'chore(icons): sync iconGenerator (${{ steps.submodule.outputs.commit }}) and JetBrains colors'
          title: 'chore: sync icons and colors from JetBrains'
          body: |
            Automated update of the `iconGenerator` submodule to `${{ steps.submodule.outputs.commit }}`,
            of the associations generated by `bun run sync:upstream`, and of the color themes generated by
            `bun run sync:colors -- --latest` (`themes/`).

            Lint, build (including the icon checks) and unit tests passed on this change.
            Review the new associations in `src/icons/*/upstream.ts` and the color changes in `themes/` before merging.
